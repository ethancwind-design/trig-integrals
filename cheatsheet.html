<meta name="description" content="Every derivative and integral used in the MATH 1400 practice questions, typeset: derivatives, trig powers, trig substitution, partial fractions, by parts, area, volume and polar setups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
main.cs{max-width:1120px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
.cslink{margin-left:auto;font:500 15px/1 var(--font-display);color:var(--ink);text-decoration:none;padding:9px 12px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper)}
.cslink:hover{border-color:var(--accent)}
.csjump{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}
.csjump a{text-decoration:none;color:var(--ink)}
.csjump a:hover{border-color:var(--accent)}
.csg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:10px}
.csf{border:1.5px solid var(--rule);border-radius:14px;background:var(--paper);padding:14px 18px;min-width:0;overflow-x:auto}
.csf b{display:block;font:700 13px/1.2 var(--font-display);letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.csm{font-size:20px;line-height:1.5}
.csf small{display:block;font-size:15px;color:var(--muted);margin-top:8px;line-height:1.5}
.csf.w{grid-column:1/-1}
.csfoot{margin-top:40px;color:var(--muted);font-size:14px;max-width:60em}
@media (max-width:520px){.csm{font-size:16px}.csf{padding:12px 14px}}
</style>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false, enableAssistiveMml: false },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer></script>
