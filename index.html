<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trig Quest</title>
<meta name="description" content="Trig Quest: story lines, daily runs, blitz and survival modes through trig identities, integrals and MATH 1400 exam prep, plus a searchable codex of every formula.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="quest.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [] },
  svg: { fontCache: 'global' },
  options: { enableMenu: false, enableAssistiveMml: false },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" defer></script>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="ld-grid"></div>
  <div class="ld-glyphs" id="ldGlyphs" aria-hidden="true"></div>
  <div class="ld-vig"></div>
  <div class="ld-center">
    <div class="ld-logo" aria-hidden="true"><span class="ring"></span><span class="mark">∫</span></div>
    <h1 class="ld-title">TRIG QUEST</h1>
    <p class="ld-sub">identities · integrals · exam prep</p>
    <div class="ld-bar" aria-hidden="true"><div class="ld-fill" id="ldFill"></div></div>
    <div class="ld-meta"><span id="ldStatus">Booting…</span><span id="ldPct">0%</span></div>
    <p class="ld-tip" id="ldTip"></p>
    <button id="ldStart" class="ld-start" type="button" hidden>PRESS ANY KEY TO START</button>
  </div>
  <div class="ld-foot" id="ldFoot"></div>
</div>

<div id="viewport" hidden>
  <div id="stage" role="region" aria-label="Slide. Click the slide or press the right arrow to advance.">
    <header id="head">
      <div id="hrow"><div id="exlabel"></div><div id="phases" hidden></div></div>
      <div id="track" hidden></div>
    </header>
    <div id="wrap"><div id="board"><div id="main"></div><div id="side"></div></div></div>
    <div id="say" aria-live="polite"></div>
  </div>
</div>
<nav id="bar" aria-label="Slide controls" hidden>
  <a class="home" id="home" href="#/">← Main menu</a>
  <button id="prev" type="button" aria-label="Previous slide">← Back</button>
  <select id="jump" aria-label="Jump to slide"></select>
  <span id="count">–</span>
  <button id="next" type="button" aria-label="Next slide">Next →</button>
  <button id="fs" type="button">Full screen</button>
  <span id="hint">Click the slide or use ← → keys</span>
  <span id="hudpill"></span>
</nav>
<div id="mload" hidden></div>
<div id="toastbox" aria-live="polite"></div>
<noscript><p style="padding:40px;color:#fff">Trig Quest needs JavaScript. The <a href="codex.html">Codex</a> works the same way.</p></noscript>

<script src="data.js"></script>
<script src="shots.js"></script>
<script src="shotui.js"></script>
<script src="refdata.js"></script>
<script src="refconv.js"></script>
<script src="quest.js"></script>
</body>
</html>
